<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Opening RE...</title>
    <script>
        window.onload = function() {
            const segments = window.location.pathname.split('/').filter(Boolean);
            // segments = ["re-app", "post"/"profile", "id"]
            const type = segments[1];
            const id   = segments[2];

            if (type && id) {
                window.location.href = "re.gab://" + type + "/" + id;
            }
        }
    </script>
</head>
<body>
    <p>Opening RE app...</p>
</body>
</html>
